[world]
	#Distance in blocks between continent centres. A continent is 0.54 to 0.76 of
	#this across, the rest is ocean. NEVER change on an existing world.
	# Default: 14000
	# Range: 3000 ~ 60000
	plateSpacing = 14000
	#Chance that a plate holds a continent rather than open ocean. The plate at the
	#origin always does. NEVER change on an existing world.
	# Default: 0.72
	# Range: 0.1 ~ 1.0
	landChance = 0.72
	#Turn off vanilla's large copper and iron veins (the noise-driven ones, not the
	#ore features). They ignore regions entirely, so with them on every region has
	#copper and iron underground.
	disableOreVeins = true

[ores]
	#One ore per entry: name=icon item=placed feature,placed feature,...
	#The placed features are the ones the region roll switches on, off, or multiplies.
	#Ores not listed here generate as normal everywhere.
	definitions = ["coal=minecraft:coal=minecraft:ore_coal_upper,minecraft:ore_coal_lower", "copper=minecraft:raw_copper=minecraft:ore_copper,minecraft:ore_copper_large", "iron=minecraft:raw_iron=minecraft:ore_iron_upper,minecraft:ore_iron_middle,minecraft:ore_iron_small", "gold=minecraft:raw_gold=minecraft:ore_gold,minecraft:ore_gold_lower,minecraft:ore_gold_extra", "lapis=minecraft:lapis_lazuli=minecraft:ore_lapis,minecraft:ore_lapis_buried", "redstone=minecraft:redstone=minecraft:ore_redstone,minecraft:ore_redstone_lower", "diamond=minecraft:diamond=minecraft:ore_diamond,minecraft:ore_diamond_medium,minecraft:ore_diamond_large,minecraft:ore_diamond_buried", "emerald=minecraft:emerald=atlas:ore_emerald", "zinc=create:raw_zinc=create:zinc_ore", "lead=tfmg:raw_lead=tfmg:lead_ore", "nickel=tfmg:raw_nickel=tfmg:nickel_ore", "lithium=tfmg:raw_lithium=tfmg:lithium_ore", "bort=silentgear:bort=silentgear:bort_ore", "cinnabar=thaumaturge:raw_cinnabar=thaumaturge:ore_cinnabar", "amber=thaumaturge:amber=thaumaturge:ore_amber", "arcane_quartz=thaumaturge:ore_quartz=thaumaturge:ore_quartz"]
	#Tier 1 ores. A region takes 0 to 2 of these.
	tier1 = ["coal", "copper", "iron", "gold"]
	#Tier 2 ores. A region takes 0 to 2 of these.
	tier2 = ["lapis", "redstone", "diamond", "emerald"]
	#Modded ores. Rolled separately from the two tiers above, on a random stream of
	#its own, so adding or removing one never changes a region's vanilla ore or mob
	#roll. A region takes extraMin to extraMax of these.
	extra = ["zinc", "lead", "nickel", "lithium", "bort", "cinnabar", "amber", "arcane_quartz"]
	# Default: 1
	# Range: 0 ~ 10
	extraMin = 1
	# Default: 2
	# Range: 0 ~ 10
	extraMax = 2
	#How many times over an ore a region rolled generates. Above 1 because a region
	#only has a few ores, and at vanilla rates its caves look empty.
	# Default: 2
	# Range: 1 ~ 10
	rolledMultiplier = 2
	#Chance each rolled ore comes up abundant.
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	abundantChance = 0.15
	#How many times over an abundant ore generates.
	# Default: 5
	# Range: 1 ~ 10
	abundantMultiplier = 5
	#Chance that an ore a region did NOT roll still places on a given chunk. 0 means
	#it is simply not there. Iron stays obtainable everywhere through Create washing
	#and the Minecolonies sifter.
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	absentChance = 0.0

[stone]
	#Each region replaces the overworld's plain stone with one stone type it rolls.
	#Only affects chunks generated afterwards. Deepslate is left alone.
	enabled = true
	#Stone pool: block,weight[,tag...]. Tags as for mobs: hot, cold, temperate, dry,
	#wet. Blocks that do not exist (mod not installed) are skipped. minecraft:stone
	#is a valid entry and means the region keeps plain stone.
	pool = ["minecraft:stone,2", "minecraft:granite,3", "minecraft:diorite,3", "minecraft:andesite,3", "minecraft:tuff,2", "minecraft:calcite,1", "create:limestone,2", "create:scoria,1,hot", "create:scorchia,1,hot,dry", "create:asurine,1", "create:crimsite,1", "create:ochrum,1,dry", "create:veridium,1,wet", "quark:jasper,2,hot", "quark:shale,2", "quark:limestone,2", "quark:permafrost,2,cold"]

[mobs]
	#Monster pool: entity,weight,minGroup,maxGroup[,tag...]. Tags limit where a mob
	#can be rolled: hot, cold, temperate, dry, wet. A region rolls a handful of these;
	#the rest do not spawn naturally there. Monsters not in this list (modded ones)
	#are left alone.
	monsters = ["minecraft:zombie,95,4,4", "minecraft:skeleton,100,4,4", "minecraft:creeper,100,4,4", "minecraft:spider,100,4,4", "minecraft:enderman,10,1,4", "minecraft:witch,5,1,1", "minecraft:slime,100,4,4", "minecraft:husk,80,4,4,hot", "minecraft:stray,80,4,4,cold", "minecraft:bogged,50,4,4,wet"]
	#Animal pool, same format as monsters.
	creatures = ["minecraft:cow,8,4,4", "minecraft:pig,10,4,4", "minecraft:sheep,12,4,4", "minecraft:chicken,10,4,4", "minecraft:rabbit,4,2,3", "minecraft:horse,5,2,6,temperate", "minecraft:donkey,1,1,3", "minecraft:llama,5,4,6", "minecraft:goat,5,1,3,cold", "minecraft:fox,8,2,4", "minecraft:wolf,8,4,4", "minecraft:polar_bear,1,1,2,cold", "minecraft:armadillo,10,1,2,hot", "minecraft:camel,1,1,1,hot,dry", "minecraft:frog,10,2,5,wet", "minecraft:parrot,40,1,2,hot,wet", "minecraft:ocelot,2,1,3,hot,wet", "minecraft:panda,1,1,2,wet"]
	# Default: 3
	# Range: 1 ~ 20
	monstersMin = 3
	# Default: 5
	# Range: 1 ~ 20
	monstersMax = 5
	# Default: 3
	# Range: 1 ~ 20
	creaturesMin = 3
	# Default: 4
	# Range: 1 ~ 20
	creaturesMax = 4
	#Chance each rolled mob comes up abundant.
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	abundantChance = 0.12
	#Spawn weight multiplier for an abundant mob.
	# Default: 4
	# Range: 1 ~ 20
	abundantMultiplier = 4
