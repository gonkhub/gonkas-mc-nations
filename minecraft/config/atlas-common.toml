[world]
	#The world's scale. The starter continent (around 0,0) is laid out exactly as in
	#atlas 1.2 with this spacing; every other continent is placed on cells 0.4 of it
	#across, varying from islets to continents larger than the starter one.
	#NEVER change on an existing world.
	# Default: 14000
	# Range: 3000 ~ 60000
	plateSpacing = 14000
	#Kept for the starter continent: its coastline was shaped by which of its atlas
	#1.2 neighbours existed, and this decides that. It no longer sets how much of the
	#rest of the world is land. NEVER change on an existing world.
	# Default: 0.72
	# Range: 0.1 ~ 1.0
	landChance = 0.72
	#Turn off vanilla's large copper and iron veins (the noise-driven ones, not the
	#ore features). They ignore regions entirely, so with them on every region has
	#copper and iron underground.
	disableOreVeins = true
	#Give each region ONE TerraBlender layout (vanilla, Biomes O' Plenty, ...) instead
	#of letting TerraBlender's own patchwork switch between them every few hundred
	#blocks. The region's climate is already pinned, so with this on a region draws
	#its biomes from one family. Picked by the layouts' TerraBlender weights. Only
	#chunks generated afterwards change; on an existing world the old/new border shows
	#as a biome seam, and region names (which come from the main biome) can change.
	lockBiomeLayout = true

[ores]
	#One ore per entry: name=icon item=placed feature,placed feature,...
	#The placed features are the ones the region roll switches on, off, or multiplies.
	#Ores not listed here generate as normal everywhere.
	definitions = ["coal=minecraft:coal=minecraft:ore_coal_upper,minecraft:ore_coal_lower", "copper=minecraft:raw_copper=minecraft:ore_copper,minecraft:ore_copper_large", "iron=minecraft:raw_iron=minecraft:ore_iron_upper,minecraft:ore_iron_middle,minecraft:ore_iron_small", "gold=minecraft:raw_gold=minecraft:ore_gold,minecraft:ore_gold_lower,minecraft:ore_gold_extra", "lapis=minecraft:lapis_lazuli=minecraft:ore_lapis,minecraft:ore_lapis_buried", "redstone=minecraft:redstone=minecraft:ore_redstone,minecraft:ore_redstone_lower", "diamond=minecraft:diamond=minecraft:ore_diamond,minecraft:ore_diamond_medium,minecraft:ore_diamond_large,minecraft:ore_diamond_buried", "emerald=minecraft:emerald=atlas:ore_emerald", "zinc=create:raw_zinc=create:zinc_ore", "lead=tfmg:raw_lead=tfmg:lead_ore", "nickel=tfmg:raw_nickel=tfmg:nickel_ore", "lithium=tfmg:raw_lithium=tfmg:lithium_ore", "bort=silentgear:bort=silentgear:bort_ore", "cinnabar=thaumaturge:raw_cinnabar=thaumaturge:ore_cinnabar", "amber=thaumaturge:amber=thaumaturge:ore_amber", "arcane_quartz=thaumaturge:ore_quartz=thaumaturge:ore_quartz"]
	#Tier 1 ores. A region takes 0 to 2 of these.
	tier1 = ["coal", "copper", "iron", "gold"]
	#Tier 2 ores. A region takes 0 to 2 of these.
	tier2 = ["lapis", "redstone", "diamond", "emerald"]
	#Modded ores. Rolled separately from the two tiers above, on a random stream of
	#its own, so adding or removing one never changes a region's vanilla ore or mob
	#roll. A region takes extraMin to extraMax of these.
	extra = ["zinc", "lead", "nickel", "lithium", "bort", "cinnabar", "amber", "arcane_quartz"]
	# Default: 1
	# Range: 0 ~ 10
	extraMin = 1
	# Default: 2
	# Range: 0 ~ 10
	extraMax = 2
	#How many times over an ore a region rolled generates. Above 1 because a region
	#only has a few ores, and at vanilla rates its caves look empty.
	# Default: 2
	# Range: 1 ~ 10
	rolledMultiplier = 2
	#Chance each rolled ore comes up abundant.
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	abundantChance = 0.15
	#How many times over an abundant ore generates.
	# Default: 5
	# Range: 1 ~ 10
	abundantMultiplier = 5
	#Chance that an ore a region did NOT roll still places on a given chunk. 0 means
	#it is simply not there. Iron stays obtainable everywhere through Create washing
	#and the Minecolonies sifter.
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	absentChance = 0.0

[stone]
	#Each region replaces the overworld's plain stone with one stone type it rolls.
	#Only affects chunks generated afterwards. Deepslate is left alone.
	enabled = true
	#Stone pool: block,weight[,tag...]. Tags as for mobs: hot, cold, temperate, dry,
	#wet. Blocks that do not exist (mod not installed) are skipped. minecraft:stone
	#is a valid entry and means the region keeps plain stone.
	pool = ["minecraft:stone,2", "minecraft:granite,3", "minecraft:diorite,3", "minecraft:andesite,3", "minecraft:tuff,2", "minecraft:calcite,1", "create:limestone,2", "create:scoria,1,hot", "create:scorchia,1,hot,dry", "create:asurine,1", "create:crimsite,1", "create:ochrum,1,dry", "create:veridium,1,wet", "quark:jasper,2,hot", "quark:shale,2", "quark:limestone,2", "quark:permafrost,2,cold"]

[mobs]
	#Monster pool: entity,weight,minGroup,maxGroup[,tag...]. Tags limit where a mob
	#can be rolled: hot, cold, temperate, dry, wet. A region rolls a handful of these;
	#the rest do not spawn naturally there. Monsters not in this list (modded ones)
	#are left alone.
	monsters = ["minecraft:zombie,95,4,4", "minecraft:skeleton,100,4,4", "minecraft:creeper,100,4,4", "minecraft:spider,100,4,4", "minecraft:enderman,10,1,4", "minecraft:witch,5,1,1", "minecraft:slime,100,4,4", "minecraft:husk,80,4,4,hot", "minecraft:stray,80,4,4,cold", "minecraft:bogged,50,4,4,wet"]
	#Animal pool, same format as monsters.
	creatures = ["minecraft:cow,8,4,4", "minecraft:pig,10,4,4", "minecraft:sheep,12,4,4", "minecraft:chicken,10,4,4", "minecraft:rabbit,4,2,3", "minecraft:horse,5,2,6,temperate", "minecraft:donkey,1,1,3", "minecraft:llama,5,4,6", "minecraft:goat,5,1,3,cold", "minecraft:fox,8,2,4", "minecraft:wolf,8,4,4", "minecraft:polar_bear,1,1,2,cold", "minecraft:armadillo,10,1,2,hot", "minecraft:camel,1,1,1,hot,dry", "minecraft:frog,10,2,5,wet", "minecraft:parrot,40,1,2,hot,wet", "minecraft:ocelot,2,1,3,hot,wet", "minecraft:panda,1,1,2,wet"]
	# Default: 3
	# Range: 1 ~ 20
	monstersMin = 3
	# Default: 5
	# Range: 1 ~ 20
	monstersMax = 5
	# Default: 3
	# Range: 1 ~ 20
	creaturesMin = 3
	# Default: 4
	# Range: 1 ~ 20
	creaturesMax = 4
	#Chance each rolled mob comes up abundant.
	# Default: 0.12
	# Range: 0.0 ~ 1.0
	abundantChance = 0.12
	#Spawn weight multiplier for an abundant mob.
	# Default: 4
	# Range: 1 ~ 20
	abundantMultiplier = 4

[plants]
	#Each region rolls which wild plants grow in it. A plant the region did not roll
	#does not generate there at all; one it did roll generates even where the
	#region's biomes would not normally carry it (see supply). Seeds and crops from
	#anywhere else - grass, loot, mob drops, trades - are untouched, and anything
	#planted by a player grows anywhere. Only affects chunks generated afterwards.
	enabled = true
	#One plant per entry: name=icon item=placed feature,placed feature,...[=tag,tag]
	#Tags limit which regions can roll it, as for mobs: hot, cold, temperate, dry,
	#wet, nothot, notcold (all must hold). Entries whose features are all missing
	#(mod not installed) are skipped. Plants not listed here generate as normal.
	#Sugar cane is deliberately not listed: paper and books stay available everywhere.
	pool = ["onion=farmersdelight:onion=farmersdelight:patch_wild_onions", "cabbage=farmersdelight:cabbage=farmersdelight:patch_wild_cabbages", "tomato=farmersdelight:tomato=farmersdelight:patch_wild_tomatoes=notcold", "carrot=minecraft:carrot=farmersdelight:patch_wild_carrots", "potato=minecraft:potato=farmersdelight:patch_wild_potatoes", "beetroot=minecraft:beetroot=farmersdelight:patch_wild_beetroots", "rice=farmersdelight:rice_panicle=farmersdelight:patch_wild_rice=wet", "pumpkin=minecraft:pumpkin=minecraft:patch_pumpkin", "melon=minecraft:melon_slice=minecraft:patch_melon,minecraft:patch_melon_sparse=notcold", "sweet_berries=minecraft:sweet_berries=minecraft:patch_berry_common,minecraft:patch_berry_rare=nothot", "bamboo=minecraft:bamboo=minecraft:bamboo,minecraft:bamboo_light=notcold,wet", "flax=supplementaries:flax=supplementaries:wild_flax", "silent_flax=silentgear:flax_fiber=silentgear:wild_flax", "fluffy=silentgear:fluffy_puff=silentgear:wild_fluffy", "sichuan_pepper=kaleidoscope_grilling:sichuan_pepper=kaleidoscope_grilling:pepper_tree"]
	# Default: 3
	# Range: 0 ~ 20
	plantsMin = 3
	# Default: 5
	# Range: 0 ~ 20
	plantsMax = 5
	#Chance each rolled plant comes up abundant.
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	abundantChance = 0.15
	#How many times over an abundant plant generates.
	# Default: 3
	# Range: 1 ~ 10
	abundantMultiplier = 3
	#Place a rolled plant in chunks whose biome would not carry it (wild cabbages are
	#beach-only, wild rice wet-only, wild onions mid-temperature only), at the plant's
	#own rate. Without this a region can roll a plant that never appears in it. The
	#plant's own ground checks still apply: wild cabbages need sand and wild rice
	#needs shallow water, so those turn up on the region's beaches and riverbanks.
	supply = true

[trees]
	#Each region rolls which tree types grow in it. A tree the region did not roll is
	#swapped, where worldgen would have placed it, for one the region did roll or a
	#universal one, so forests keep their density. Bush-sized trees of a type the
	#region lacks are dropped instead. Saplings planted by players grow anywhere.
	#Only affects chunks generated afterwards.
	enabled = true
	#Tree types every region has, in the same format as the pool (weight and tags are
	#ignored). Keeps basic wood - and the saplings Tree Physics and the Minecolonies
	#lumberjack depend on - obtainable everywhere.
	universal = ["oak=minecraft:oak_log=minecraft:oak=1"]
	#Tree pool: name=trunk block,trunk block,...=configured feature=weight[=tag,tag].
	#A tree is recognised by its trunk block, so every vanilla and modded variant of
	#a type is covered at once. The configured feature is what is grown in its place
	#elsewhere in the region. Tags as for plants. Trees whose trunk is in neither
	#list (Thaumaturge greatwood and silverwood, mushrooms) are left alone.
	pool = ["spruce=minecraft:spruce_log=minecraft:spruce=6=nothot", "birch=minecraft:birch_log=minecraft:birch=6=nothot", "dark_oak=minecraft:dark_oak_log=minecraft:dark_oak=3=temperate", "jungle=minecraft:jungle_log=minecraft:jungle_tree=4=hot,wet", "acacia=minecraft:acacia_log=minecraft:acacia=5=hot", "cherry=minecraft:cherry_log=minecraft:cherry=2=temperate", "mangrove=minecraft:mangrove_log=minecraft:mangrove=2=notcold,wet", "fir=biomesoplenty:fir_log=biomesoplenty:fir_tree=5=nothot", "pine=biomesoplenty:pine_log=biomesoplenty:pine_tree=4=nothot", "maple=biomesoplenty:maple_log=biomesoplenty:red_maple_tree=4=nothot", "redwood=biomesoplenty:redwood_log,biomesoplenty:redwood_wood=biomesoplenty:redwood_tree=2=temperate", "mahogany=biomesoplenty:mahogany_log=biomesoplenty:mahogany_tree=3=notcold,wet", "jacaranda=biomesoplenty:jacaranda_log=biomesoplenty:jacaranda_tree=3=notcold", "palm=biomesoplenty:palm_log=biomesoplenty:palm_tree=3=hot", "willow=biomesoplenty:willow_log=biomesoplenty:willow_tree=3=wet", "dead=biomesoplenty:dead_log=biomesoplenty:dying_tree=2", "magic=biomesoplenty:magic_log=biomesoplenty:magic_tree=1", "umbran=biomesoplenty:umbran_log=biomesoplenty:umbran_tree=1"]
	#How many pool trees a region rolls, on top of the universal ones.
	# Default: 2
	# Range: 0 ~ 20
	treesMin = 2
	# Default: 3
	# Range: 0 ~ 20
	treesMax = 3
