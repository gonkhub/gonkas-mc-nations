#The Warded Tank, Spout and Item Drain, which tubes join as they join a jar, and the leak out of Create's own Spout and Item Drain.
[warded]
	#Suction a Warded Tank draws essentia from tubes with. Plain jars have 32, the addon's machines 48 and labelled jars 64: at 40 a tank empties plain jars, and gives to machines, spouts and labelled jars, which pull harder.
	# Default: 40
	# Range: 1 ~ 1024
	tankSuction = 40
	#Suction the Warded Spout and the Pressure Crucible draw essentia from tubes with. Above the tank's, so they empty Warded Tanks and plain jars; at 64 they tie with labelled jars.
	# Default: 64
	# Range: 1 ~ 1024
	drawSuction = 64
	#Ticks between two leaks of essentia out of Create's own Spout or Item Drain. Each leak's essentia becomes flux (spillFluxPerEssentia a point), put down round it as gas and goo.
	# Default: 20
	# Range: 1 ~ 72000
	unwardedLeakInterval = 20
	#Points of essentia a leak takes at the least.
	# Default: 3
	# Range: 1 ~ 1000
	unwardedLeakPoints = 3
	#Share of what is held that a leak takes, when that is more than unwardedLeakPoints. At 0.1 a full spout loses a tenth of its essentia every leak.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	unwardedLeakShare = 0.1

#Essentia held in tanks.
[essentia]
	#Flux released for each point of essentia let out of a tank: a Warded Tank, spout, drain, Pressure Crucible or machine that is broken, or a leak out of Create's own Spout and Item Drain. Thaumaturge releases 1 flux per point when a jar or tube breaks; a tank holds essentia pressed together, so by default it spills twice as badly.
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	spillFluxPerEssentia = 2.0

#Recharge pedestals, as seen by funnels and other automation.
[pedestals]
	#Seconds a charging item may go without gaining charge before automation may take it.
	# Default: 10
	# Range: 1 ~ 3600
	rechargeStallSeconds = 10

#The Thaumic Turbine, a generator burning essentia (or drawing chunk vis).
[turbine]
	#RPM it turns at while running.
	# Default: 32
	# Range: 1 ~ 256
	speed = 32
	#Stress capacity in SU per RPM while running, like Create's own generator settings. The default, 64, gives 2048 SU at 32 RPM.
	# Default: 64.0
	# Range: 0.0 ~ 16384.0
	stressCapacity = 64.0
	#Essentia its fuel tank holds (10 mB each).
	# Default: 100
	# Range: 1 ~ 100000
	capacity = 100
	#Suction it draws fuel from tubes with. 48 empties plain jars but not labelled ones.
	# Default: 48
	# Range: 1 ~ 1024
	suction = 48
	#Whether a wrench can switch it to draw chunk vis instead of burning essentia.
	auraModeEnabled = true
	#Chunk vis drawn per second in aura mode.
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	auraVisPerSecond = 1.0
	#Flux released for each point of vis drawn in aura mode.
	# Default: 0.1
	# Range: 0.0 ~ 100.0
	auraFluxPerVis = 0.1
	#In aura mode it stops while the chunk's vis is below this share of the chunk's base, so it can't drain a chunk dry. 0 lets it run until the vis is gone.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	auraMinimumVisShare = 0.25

#The Gyroscopic Stabiliser, an infusion stabiliser that only works while spinning.
[gyroscope]
	#Stress impact in SU per RPM, like Create's own stress settings. The default, 8, is 2048 SU for one stabiliser at 256 RPM.
	# Default: 8.0
	# Range: 0.0 ~ 1024.0
	stressImpact = 8.0
	#RPM for each step of stabilisation. Below one step it doesn't stabilise at all. Strength comes in steps so that two stabilisers geared together always match.
	# Default: 32
	# Range: 1 ~ 256
	rpmPerStep = 32
	#Stability a counter-rotating pair restores per infusion cycle, for each step. Thaumaturge's candles give 0.1 and its candle holders 0.1 to 0.2.
	# Default: 0.03
	# Range: 0.0 ~ 1.0
	stabilisationPerStep = 0.03
	#Most steps a stabiliser can reach. The default, 8 steps of 32 RPM, tops out at 256 RPM with 0.24 per pair.
	# Default: 8
	# Range: 1 ~ 64
	maxSteps = 8
	#Stress impact of the Void Gyroscopic Stabiliser in SU per RPM. The default, 24, is 6144 SU for one at 256 RPM.
	# Default: 24.0
	# Range: 0.0 ~ 1024.0
	voidStressImpact = 24.0
	#Stability a counter-rotating pair of Void Gyroscopic Stabilisers restores per infusion cycle, for each step. The matrix weakens repeats of one block, not of another, so each tier adds to the others around one altar. The default tops out at 0.5 per pair.
	# Default: 0.0625
	# Range: 0.0 ~ 4.0
	voidStabilisationPerStep = 0.0625
	#Stress impact of the Astral Gyroscopic Stabiliser in SU per RPM. The default, 64, is 16384 SU for one at 256 RPM.
	# Default: 64.0
	# Range: 0.0 ~ 1024.0
	astralStressImpact = 64.0
	#Stability a counter-rotating pair of Astral Gyroscopic Stabilisers restores per infusion cycle, for each step. The default tops out at 1 per pair, which alone covers a recipe with an instability of 10.
	# Default: 0.125
	# Range: 0.0 ~ 4.0
	astralStabilisationPerStep = 0.125

#The Infernal Crusher, which crushes items and smelts the results with Ignis vis from a relay.
[infernal_crusher]
	#Stress impact in SU per RPM. The default, 8, is what Create's Crushing Wheels take.
	# Default: 8.0
	# Range: 0.0 ~ 1024.0
	stressImpact = 8.0
	#Ignis vis drawn from a vis relay for each item smelted, in hundredths of a vis. Without it the crusher only crushes. 0 smelts for free, with no relay.
	# Default: 10
	# Range: 0 ~ 10000
	centivisPerItem = 10

#The Thaumium Drill: Create's drill with a thaumium head, which takes infusion enchantments.
[thaumium_drill]
	#Stress impact in SU per RPM. The default, 4, is what Create's Mechanical Drill takes.
	# Default: 4.0
	# Range: 0.0 ~ 1024.0
	stressImpact = 4.0
	#How much faster it breaks blocks than Create's drill at the same speed, standing or on a contraption.
	# Default: 1.5
	# Range: 0.1 ~ 16.0
	breakSpeedMultiplier = 1.5
	#With Burrowing: the most blocks of an ore vein or a tree trunk it goes on to break after the one it drilled. 0 turns Burrowing off on drills.
	# Default: 32
	# Range: 0 ~ 256
	burrowingVeinSize = 32

#The Arcane Projector, which casts a focus's spell and pays from charged wands.
[arcane_projector]
	#On a contraption: an instant or charged focus casts once every this many blocks it moves, when its spell's cooldown allows (a charged one charges in between). A channelled focus pulses while the contraption moves instead. Standing, a redstone signal works it.
	# Default: 3
	# Range: 1 ~ 64
	castEveryBlocks = 3

#The Funnel Mirror, a pair of which moves items from the block one hangs on to the block the other hangs on.
[funnel_mirror]
	#Ticks between two batches a sending Funnel Mirror moves.
	# Default: 10
	# Range: 1 ~ 1200
	interval = 10
	#Most items of one kind a sending Funnel Mirror moves at a time. Each item adds one instability at both ends, and every 128 instability is a point of flux, as for Thaumaturge's item mirrors.
	# Default: 16
	# Range: 1 ~ 64
	batch = 16

#The Aura Diffuser, which releases essentia (Auram by default) into the chunk as vis.
[aura_diffuser]
	#Most points of essentia it releases each second. How much vis a point makes is in the create_thaumaturgy:diffuser_aspects data map; Auram makes 1.
	# Default: 1
	# Range: 1 ~ 1000
	essentiaPerSecond = 1
	#Essentia its tank holds (10 mB each).
	# Default: 100
	# Range: 1 ~ 100000
	capacity = 100
	#Suction it draws from tubes with. 48 empties plain jars but not labelled ones.
	# Default: 48
	# Range: 1 ~ 1024
	suction = 48

#The Ignis Burner, a burner that needs no blaze and burns essentia (Ignis by default). How long a point lasts is in the create_thaumaturgy:burner_fuels data map.
[ignis_burner]
	#Essentia its tank holds (10 mB each).
	# Default: 100
	# Range: 1 ~ 100000
	capacity = 100
	#Suction it draws from tubes with. 48 empties plain jars but not labelled ones.
	# Default: 48
	# Range: 1 ~ 1024
	suction = 48
	#Essentia its second tank holds, for what a fuel needs beside itself to superheat (Potentia for Ignis, in the create_thaumaturgy:burner_fuels data map). 10 mB each.
	# Default: 50
	# Range: 1 ~ 100000
	catalystCapacity = 50

#The Mirror Frogport, which sends packages straight to the Mirror Frogport they are addressed to.
[mirror_frogport]
	#Vis the sender's chunk pays for each package. With too little vis the packages wait. 0 sends for free.
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	visPerPackage = 1.0
	#Flux each package leaves in the sender's chunk, released in whole points.
	# Default: 0.1
	# Range: 0.0 ~ 1000.0
	fluxPerPackage = 0.1

#The golem post: Courier Seals, which have golems carry packages by address.
[golem_post]
	#How far apart, in blocks, two Courier Seals may be for golems to carry a package from one to the other.
	# Default: 32
	# Range: 1 ~ 256
	range = 32

#The Golem Stockroom: a Stockroom Seal on a Packager, which puts what golems keep on Create's stock network.
[golem_stockroom]
	#How long, in seconds, an order waits for golems to bring its goods to the Packager. Then it is packed with whatever came, and anything missing is left out, as Create's own Packagers leave out what they don't have.
	# Default: 120
	# Range: 5 ~ 3600
	orderTimeout = 120

#Golems at the crank: Crank Seals, which have a golem turn one of Create's Hand Cranks.
[golem_crank]
	#The most a golem's traits can multiply a Hand Crank's stress capacity by. The factor of each trait is in the data map create_thaumaturgy:crank_strength. 1 makes every golem as strong as a hand.
	# Default: 4.0
	# Range: 1.0 ~ 64.0
	maxStrength = 4.0
	#With "Only while there's work" on a Crank Seal: how many more turns the golem gives the shaft after the last load at its Store seals is used up, so the machine can finish it. A belt moves 2.5 blocks a turn.
	# Default: 2
	# Range: 0 ~ 64
	runOnTurns = 2

#The Golem Treadwheel, which a golem runs in, set to it by a Crank Seal.
[golem_treadwheel]
	#The wheel's RPM is this times the golem's work speed (Thaumaturge's, 1 for a plain golem of rank 0; light frames, roller legs and rank make it faster), rounded.
	# Default: 16.0
	# Range: 1.0 ~ 256.0
	rpmPerWorkSpeed = 16.0
	#Stress capacity in SU per RPM while a golem runs it. The default, 32, gives 512 SU at 16 RPM.
	# Default: 32.0
	# Range: 0.0 ~ 16384.0
	stressCapacity = 32.0

#The Taintacle Wheel, a Large Water Wheel turned by a Taintacle in a jar that eats flux goo.
[taintacle_wheel]
	#RPM while it is fed.
	# Default: 16
	# Range: 1 ~ 256
	speed = 16
	#Stress capacity in SU per RPM while it is fed. The default, 128, is a Large Water Wheel's: 2048 SU at 16 RPM.
	# Default: 128.0
	# Range: 0.0 ~ 16384.0
	stressCapacity = 128.0
	#Food the jar holds, in mB of flux goo (125 mB a point of flux).
	# Default: 8000
	# Range: 125 ~ 1000000
	capacity = 8000
	#Food it eats a minute, in mB, turning or not. What it eats leaves the world.
	# Default: 1500
	# Range: 0 ~ 1000000
	gooPerMinute = 1500
	#It is hungry, as the goggles say, when its food would last less than this many seconds.
	# Default: 120
	# Range: 0 ~ 3600
	hungrySeconds = 120
	#Seconds it starves, its wheel stopped, before it starts to spread taint.
	# Default: 30
	# Range: 0 ~ 3600
	starveGraceSeconds = 30
	#While it spreads taint: ticks between two forced fibre spreads (Thaumaturge's own, which turns the ground they reach into the Tainted Lands). Thaumaturge's wuss mode stops them.
	# Default: 40
	# Range: 1 ~ 12000
	spreadInterval = 40
	#The spreads start from a spot this many blocks from the hub at most.
	# Default: 4
	# Range: 0 ~ 16
	spreadRadius = 4
	#It strikes living things within this many blocks of the wheel's 3 by 3.
	# Default: 3.0
	# Range: 0.0 ~ 16.0
	reach = 3.0
	#Damage a strike does, of Thaumaturge's taint type, which goes through armour.
	# Default: 4.0
	# Range: 0.0 ~ 1000.0
	strikeDamage = 4.0
	#Ticks between two strikes.
	# Default: 30
	# Range: 1 ~ 1200
	strikeInterval = 30
	#A Taintacle can be caught in a Warded Jar at this share of its health or less.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	catchHealth = 0.25

#Grasp, the spell effect whose tentacles drag what the spell hits back to the caster.
[grasp]
	#How far it drags at power 1, in blocks; the part's power setting and a charged cast multiply it. Channelled, it carries what it took along the caster's look, as far from the caster's eyes as it was when taken, and the mouse wheel takes it nearer or farther, at most this times the power setting; it lets go of what gets a block farther than that, or than it was when taken.
	# Default: 8.0
	# Range: 0.0 ~ 64.0
	reach = 8.0
	#The farthest it drags in one cast, whatever the power, in blocks.
	# Default: 24.0
	# Range: 0.0 ~ 128.0
	maxReach = 24.0
	#Blocks it drags a tick.
	# Default: 0.5
	# Range: 0.05 ~ 4.0
	speed = 0.5
	#Ticks it holds a mob or an item where the drag ends, before it lets go. Channelled, it carries it until the channel stops or it tires (carryTicks).
	# Default: 20
	# Range: 0 ~ 1200
	holdTicks = 20
	#Ticks it holds a player where the drag ends. Channelled, it carries a player until the channel stops or they break free (playerCarryTicks).
	# Default: 10
	# Range: 0 ~ 1200
	playerHoldTicks = 10
	#Ticks it holds a train carriage or a minecart contraption where it is, at power 1; the part's power setting and a charged cast multiply it; channelled, it holds it until the channel stops. A held train stops and takes up its speed again after, as Create's own trains do when a drill on them is stalled.
	# Default: 40
	# Range: 0 ~ 1200
	contraptionHoldTicks = 40
	#Blocks one notch of the mouse wheel takes what a channelled Grasp carries nearer or farther.
	# Default: 0.5
	# Range: 0.05 ~ 8.0
	scrollStep = 0.5
	#Blocks a tick a channelled Grasp can swing a mob or an item. A player it carries moves at its drag speed instead.
	# Default: 1.5
	# Range: 0.05 ~ 4.0
	carrySpeed = 1.5
	#Blocks a tick a mob must be swung at for a wall or the ground to hurt it. Slower does nothing.
	# Default: 0.4
	# Range: 0.05 ~ 4.0
	slamMinSpeed = 0.4
	#Blocks a mob must be swung through, fast and one way, before a wall or the ground hurts it. With less there is no weight behind it, and it is only put down.
	# Default: 2.0
	# Range: 0.0 ~ 64.0
	slamRunUp = 2.0
	#Blocks of swing behind a slam for its full damage; less does less.
	# Default: 5.0
	# Range: 0.1 ~ 64.0
	slamFullRunUp = 5.0
	#Damage of a slam at the top carry speed with a full run-up, before power; less at a slower or shorter swing. Armour counts. Players it carries are not slammed: their own client moves them, so the server can't judge what they hit. With slamDamagePerPower, a full slam does what an Earth strike of the same power does, and a little more: 4, 6 and 8 at power 1, 2 and 3.
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	slamBaseDamage = 2.0
	#Damage a full slam gains for each point of power: the part's power setting times what the rest of the spell does to its power, as Amplify does, so it pays for itself as Thaumaturge's own strikes do.
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	slamDamagePerPower = 2.0
	#Ticks after a slam before the same grasp can slam again.
	# Default: 20
	# Range: 0 ~ 1200
	ticksBetweenSlams = 20
	#Whether a channelled Grasp cast from a wand carries what it takes along the caster's look. Off, it drags and holds what it takes as a spell cast at once does, and the channel ends. An Arcane Projector's channelled hold works either way. Also set by the command /createthaumaturgy grasp channelling true|false.
	channelledCarry = true
	#Ticks a wand's channelled carry holds a mob or an item at power 1 before the tentacle tires, lets go and the channel ends. It slips in its grip for the last second. A projector's hold never tires.
	# Default: 80
	# Range: 1 ~ 12000
	carryTicks = 80
	#Ticks more a carry holds for each step of the power setting above 1.
	# Default: 40
	# Range: 0 ~ 12000
	carryTicksPerPower = 40
	#Ticks a wand's channelled carry holds a player before they break free, whatever the power.
	# Default: 40
	# Range: 1 ~ 12000
	playerCarryTicks = 40
	#Blocks above the ground under it a channelled carry can lift what it holds, at power 1. So a drop hurts about as much as a slam, and no more.
	# Default: 5.0
	# Range: 0.0 ~ 256.0
	lift = 5.0
	#Blocks more it can lift for each step of the power setting above 1.
	# Default: 2.0
	# Range: 0.0 ~ 256.0
	liftPerPower = 2.0
	#Ticks after a Grasp lets go of a mob before any Grasp can take it again, so no spell can drag or carry one forever. A spell that tries is seen to slip off it. An Arcane Projector's Grasp takes mobs again at once, as its saws want.
	# Default: 60
	# Range: 0 ~ 12000
	regraspTicks = 60
	#Ticks after a Grasp lets go of a player before any Grasp, a projector's too, can take them again.
	# Default: 100
	# Range: 0 ~ 12000
	playerRegraspTicks = 100
	#Whether the tentacle out of a wand pulses, blushes and lets out a heart over a grown mob that dies in its grip. Off, or over a baby or a player, it only lets go, as the tentacles out of the ground always do. It is only a sight and a sound.
	rejoices = true

#The Flux Syringe Blade, a thaumium sword with a capsule of Flux Amalgam that hits harder or is injected into the wielder.
[flux_syringe_blade]
	#Flux Amalgam the capsule holds, in mB (125 mB a point of flux).
	# Default: 1000
	# Range: 125 ~ 64000
	capacity = 1000
	#Attack damage a full capsule adds to a hit; less as it empties.
	# Default: 6.0
	# Range: 0.0 ~ 100.0
	bonusDamage = 6.0
	#Flux Amalgam a hit spends, in mB.
	# Default: 25
	# Range: 0 ~ 64000
	fluxPerHit = 25
	#Flux Amalgam an injection takes from the capsule, in mB: a whole dose. A capsule with less gives what it has, for a smaller dose.
	# Default: 100
	# Range: 1 ~ 64000
	injectionFlux = 100
	#Seconds after an injection before the blade can inject again.
	# Default: 120
	# Range: 0 ~ 3600
	cooldownSeconds = 120
	#Seconds of Speed and Strength from a dose of almost nothing, the last of a capsule.
	# Default: 30
	# Range: 1 ~ 3600
	minSeconds = 30
	#Seconds of Speed and Strength from a whole dose.
	# Default: 60
	# Range: 1 ~ 3600
	maxSeconds = 60
	#Level of the Speed, less one: 0 is Speed I.
	# Default: 3
	# Range: 0 ~ 9
	speedAmplifier = 3
	#Level of the Strength, less one: 0 is Strength I.
	# Default: 1
	# Range: 0 ~ 9
	strengthAmplifier = 1
	#Seconds of Thaumaturge's Flux Taint an injection gives.
	# Default: 5
	# Range: 0 ~ 600
	fluxTaintSeconds = 5
	#Temporary warp a whole dose gives; less from a smaller dose, at least 1.
	# Default: 6
	# Range: 0 ~ 100
	temporaryWarp = 6
	#Warp that stays (Thaumaturge's normal warp) a whole dose adds on top.
	# Default: 1
	# Range: 0 ~ 100
	stickyWarp = 1
	#This many injections within the window leave a point of permanent warp, and every one after.
	# Default: 3
	# Range: 1 ~ 100
	permanentWarpAfter = 3
	#The window, in minutes.
	# Default: 10
	# Range: 1 ~ 1440
	permanentWarpWindowMinutes = 10

#The Arcane Assembler, which crafts arcane workbench recipes from an Arcane Formula.
[arcane_assembler]
	#Stress impact in SU per RPM.
	# Default: 8.0
	# Range: 0.0 ~ 1024.0
	stressImpact = 8.0
	#How much turning one craft takes: the RPM is added up every tick until it reaches this. At the default a craft takes 5 seconds at 32 RPM and under a second at 256.
	# Default: 3200
	# Range: 1 ~ 1000000
	workPerCraft = 3200
	#Relay vis, of the crystal's primal, paid for each crystal a craft asks for and the assembler has no crystal item for. Thaumaturge's workbench takes 2 from a vis source. 0 means crystals can only be paid in crystals.
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	visPerCrystal = 2.0
	#What a craft's chunk vis is multiplied by when crystal items pay for any of its crystals, rounded up. Thaumaturge's workbench charges 1.25. A craft paid wholly in relay vis pays the plain cost.
	# Default: 1.25
	# Range: 1.0 ~ 10.0
	crystalVisSurcharge = 1.25

#Ventilation: Encased Fans move flux gas along their air streams.
[ventilation]
	#How many ticks a fan takes to move the flux gas in its stream one block on. Left alone, gas rises a block every 10 ticks. 0 turns ventilation off.
	# Default: 5
	# Range: 0 ~ 200
	ticksPerBlock = 5

#Thaumaturge items fired from a Potato Cannon.
[ammunition]
	#Whether Alumentum fired from a Potato Cannon breaks blocks where it explodes. Thrown by hand it always does; from a cannon it is off unless this is set.
	explosionsBreakBlocks = false

#The Difference Engine, which saves aspects at the research table below it while spinning.
[difference_engine]
	#Stress impact in SU per RPM, like Create's own stress settings.
	# Default: 4.0
	# Range: 0.0 ~ 1024.0
	stressImpact = 4.0
	#RPM below which it doesn't help at all.
	# Default: 16
	# Range: 1 ~ 256
	minimumSpeed = 16
	#RPM at which it reaches its full save chance. Between the minimum and this, the chance grows in proportion to speed.
	# Default: 256
	# Range: 1 ~ 1024
	fullSpeed = 256
	#Chance at full speed that an aspect written or combined at the table isn't used up. The research table adds the blocks above both its halves together and caps the total at 0.5; Thaumaturge's candle holders give 0.05 to 0.15.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	saveChance = 0.2

#The Node Overclocker, which stands on a Node Transducer, is its redstone signal while it turns, and refills the energized node below faster.
[node_overclocker]
	#Stress impact in SU per RPM with no energized node below.
	# Default: 8.0
	# Range: 0.0 ~ 1024.0
	stressImpact = 8.0
	#Stress impact in SU per RPM added for every point of primal vis the energized node below holds when full, so a bigger node is heavier to drive.
	# Default: 0.25
	# Range: 0.0 ~ 64.0
	stressPerNodePoint = 0.25
	#RPM at which the extra refill is at its full. Below it the extra grows in proportion to speed.
	# Default: 256
	# Range: 1 ~ 1024
	fullSpeed = 256
	#Refill added at full speed, as a share of what the node refills by itself: 1 doubles it. Each extra point costs the chunk the same vis as one of the node's own. Above 3 the node can't hand out what it refills.
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	extraRefill = 1.0

#The Pressure Crucible, a sealed vat that runs one crucible recipe for less essentia, under pressure, and makes flux goo while it does.
[pressure_crucible]
	#How many blocks tall a vat can be. It is 1 to 3 blocks wide, as Create's Fluid Tank is.
	# Default: 8
	# Range: 1 ~ 32
	maxHeight = 8
	#Share of a recipe's essentia saved per pressure level. The level is the smaller of the heat under the vat (1 per heated burner, 2 per superheated one) and its blocks / 4, at most 18, as for Create's boiler. The default, 0.02, is 36% off at level 18. Whatever this is, a recipe never saves more than its product loses: the essentia it does not keep past its catalyst.
	# Default: 0.02
	# Range: 0.0 ~ 0.05
	discountPerLevel = 0.02
	#Points of liquid essentia a vat holds per block (10 mB a point), shared between its recipe's aspects as the recipe uses them.
	# Default: 25
	# Range: 1 ~ 10000
	essentiaPerBlock = 25
	#Water a vat holds per block, in mB.
	# Default: 1000
	# Range: 50 ~ 64000
	waterPerBlock = 1000
	#Water used by each craft, in mB. Thaumaturge's crucible uses 50.
	# Default: 50
	# Range: 0 ~ 1000
	waterPerCraft = 50
	#Ticks between crafts, at any pressure level above 0.
	# Default: 10
	# Range: 1 ~ 1200
	craftInterval = 10
	#Points of flux goo (125 mB each, a point of flux each) made for every point of essentia the discount saves. The default, 0.25, is the flux a basic smelter leaks making that essentia.
	# Default: 0.25
	# Range: 0.0 ~ 8.0
	gooPerSavedPoint = 0.25
	#Flux goo the sump holds per block, in mB. A full sump is over pressure.
	# Default: 250
	# Range: 125 ~ 8000
	sumpPerBlock = 250
	#How full the sump is, as a share, when a Relief Valve on the vat opens.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	valveOpensAt = 0.5
