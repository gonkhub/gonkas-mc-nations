#Far From Home: replaces its monster level curve and monster gear with distance
#bands that follow the gear players realistically have at each distance from spawn.
#Distance is straight-line blocks from the world spawn point, as Far From Home measures
#it. Far From Home's own healthScalingPerLevel, damageScalingPerLevel and
#showVisualIndicators still apply; its chunksPerTier and gear settings no longer drive
#monsters (they still drive loot bags, ore scaling and boss encounters).
[farfromhome]
	#Use the bands below. false hands monsters back to Far From Home's own linear
	#curve and its own gear table, unchanged.
	enabled = true
	#Monster base level by distance: "blocks=level" anchor points, in increasing
	#distance. Between two anchors the level rises in a straight line; past the last
	#one it keeps rising at the last segment's slope. The base level is rounded down.
	#Level benchmarkLevel (6) is a stock Minecraft monster. Defaults (1.12.0, #45): easier
	#than vanilla across the starter continent, vanilla at its coast (4.8k); the first
	#ring of continents (14-30k) only 8-11, about x1.2-1.5; a steady climb after that.
	#Before 1.12.0 the first ring was 11-17 on a curve that also counted from level 0,
	#and geared monsters there two-shot players through diamond.
	levelCurve = ["0=1", "4800=6", "14000=8", "30000=11", "45000=14", "60000=18", "75000=23", "90000=32", "120000=50", "200000=120"]
	#Each monster gets base level + a random 0..spread on top. Far From Home's own
	#spread was its maxMonsterLevelPerTier (2).
	# Default: 2
	# Range: 0 ~ 50
	levelSpread = 2
	#Monsters in the c:bosses tag (every Cataclysm boss, the Wither) never go above
	#this level, and never get gear. A boss is a fixed fight players gear up for; at
	#the far-out levels its health would sit on the 1024 max-health cap and its
	#damage would one-shot anything. A boss is also never below benchmarkLevel, so it
	#is never weaker than stock. 0 leaves bosses unscaled.
	# Default: 10
	# Range: 0 ~ 10000
	bossMaxLevel = 10
	#Monster gear by distance, one band per entry, in increasing distance:
	#"fromBlocks,chance,leather,chain,gold,iron,diamond,netherite".
	#chance is the chance a monster gets gear at all; it is interpolated between one
	#band and the next. The six numbers are relative weights for the material of
	#EACH piece, rolled per piece, so a geared monster usually wears a mixed set.
	#Only zombies, skeletons and piglins (and their variants) get armor, because
	#those are the monsters whose models show it; anything else would wear invisible
	#armor. A weapon is only given to a monster with an empty hand, so a skeleton
	#keeps its bow and a piglin its crossbow.
	gearBands = ["0,0.05,100,0,0,0,0,0", "4800,0.11,0,50,50,0,0,0", "9600,0.13,0,40,30,30,0,0", "14000,0.16,0,30,10,60,0,0", "30000,0.22,0,15,5,78,2,0", "40000,0.26,0,5,0,85,10,0", "50000,0.30,0,0,0,70,30,0", "60000,0.36,0,0,0,35,60,5", "75000,0.45,0,0,0,10,65,25", "90000,0.60,0,0,0,0,40,60", "120000,0.75,0,0,0,0,0,100"]
	#The level at which a monster has exactly its stock Minecraft health and damage.
	#Each level away from it changes health by Far From Home's healthScalingPerLevel
	#and damage by its damageScalingPerLevel (0.1 and 0.08 in this pack), so with the
	#defaults level 1 has half the health and 60% of the damage, level 11 x1.5 / x1.4.
	#Far From Home itself counted from level 0, so its level 6 was already x1.6 health.
	# Default: 6
	# Range: 0 ~ 1000
	benchmarkLevel = 6
	#Health and damage are never scaled below this fraction of stock.
	# Default: 0.5
	# Range: 0.05 ~ 1.0
	minMultiplier = 0.5
	#Monsters already in the world (they do not despawn: outpost pillagers, champions,
	#anything name-tagged) were scaled by the old rules - and those saved before omnifix
	#1.7.0 were re-scaled on every chunk load, some to 5x their health. With this on,
	#each one is scaled again from its stock stats by the current curve and benchmark,
	#once, the next time it loads. Each change is logged.
	rebaseExisting = true

#Create windmills turn faster the higher their Windmill Bearing sits.
#Create's own speed (1 RPM per windmillSailsPerRPM sail blocks, 1..16 RPM) is
#multiplied by a factor that rises in a straight line from 1.0 at startY to
#maxMultiplier at fullY, and stays at maxMultiplier above that. Stress capacity
#follows speed, as it always does for a Create generator, so a high windmill also
#supplies more SU. Read on the server; takes effect when a windmill is (re)assembled.
[windmillAltitude]
	#false gives windmills Create's own speed at every height, unchanged.
	enabled = true
	#Bearing Y at and below which there is no bonus. Default is sea level.
	# Default: 63
	# Range: -64 ~ 320
	startY = 63
	#Bearing Y at which the full bonus is reached. Default is the build height.
	# Default: 320
	# Range: -64 ~ 2048
	fullY = 320
	#Speed multiplier at fullY. 2.0 means a 16 RPM windmill turns at 32 RPM at the
	#top of the world (and 24 RPM about halfway up, around Y 190).
	# Default: 2.0
	# Range: 1.0 ~ 16.0
	maxMultiplier = 2.0

#Champions. Two mods make champion monsters and neither looks at distance from spawn:
#Thaumaturge champions get a flat +100 max health and triple attack damage anywhere,
#and Mob Champions multiplies a monster's health by its rank. The two stacked on one
#zombie gave a ~300 hp monster 500 blocks from spawn. Distance is straight-line
#blocks from the world spawn point, as for the Far From Home bands above.
[champions]
	#No Thaumaturge or Mob Champions champions on the starter continent (atlas plate
	#0,0 and its waters; without atlas, within 4800 blocks of spawn). Neither mod rolls
	#there, and a champion already there loses its champion bonuses when it next loads.
	starterContinentNoChampions = true
	#Scale Thaumaturge champion bonuses by distance with the two curves below.
	#false gives Thaumaturge's own +100 health and x3 damage everywhere.
	scaleThaumaturgeChampions = true
	#Thaumaturge champion max health bonus (flat hit points, added before any
	#multiplier) by distance: "blocks=bonus" anchor points, a straight line between
	#them, flat past the last. Thaumaturge's own bonus is 100. A monster keeps the
	#bonus it was first given, so walking does not change it.
	thaumaturgeHealthBonus = ["0=20", "14000=30", "30000=50", "60000=100"]
	#Thaumaturge champion attack damage bonus by distance, as a multiplier added on
	#top: 0.5 means x1.5 damage, Thaumaturge's own 2.0 means x3. Same format as
	#above. Also scales the extra damage of Thaumaturge's 'warrior' champion type in
	#the same proportion.
	thaumaturgeDamageBonus = ["0=0.5", "14000=0.75", "30000=1.5", "60000=2.0"]
	#A monster is a Thaumaturge champion or a Mob Champions champion, never both.
	#Whichever rolls first wins; the other one is skipped for that monster.
	noDoubleChampions = true
