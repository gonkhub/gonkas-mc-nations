#Behaviour.
[behaviour]
	#Give items made by Create's processing recipes and sequenced assembly aspects.
	createRecipeAspects = true
	#Share of the ingredients' aspects a Create recipe passes on, before dividing by the output count. Thaumaturge uses 0.75 for its own crafting; above 1 would let machines create aspects.
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	createRecipeAspectShare = 0.75
	#Goggles of Revealing count as Engineer's Goggles.
	revealingGogglesAsEngineersGoggles = true
	#Funnels, chutes and other automation can load and unload infusion and recharge pedestals.
	pedestalAutomation = true
	#Spouts and item drains can fill and empty phials, jars and the harness's fuel jar.
	essentiaItemFluids = true
	#A mirror hanging on an inventory puts what arrives into it instead of throwing it out, and a chute or funnel at a mirror is joined to it by a short piece of chute.
	mirrorAutomation = true
	#A Create pump on the bottom of a Flux Condenser takes its flux as flux goo, 125 mB a point, instead of a tube taking it as Vitium.
	condenserTap = true
	#A Brain in a Jar beside a Stock Ticker runs the shop, as a Blaze Burner beside one does.
	brainStockKeeper = true
	#With JEI, the + button on an arcane workbench recipe in a Stock Keeper's screen orders its grid and its crystals, and on an infusion its items but not its aspects, which the altar draws from jars; recipes not yet researched are refused. Off, Create's own handler takes them.
	arcaneOrders = true
	#An Aer phial tops up the backtank worn, or a placed one it is used on.
	aerBacktankRefill = true

#World generation: the arcane engineers' ruins and their houses in villages. Read before the world loads, so restart the game after changing them; worlds keep what was already made.
[worldgen]
	#The Arcane Engineer's workshop among the houses of villages.
	engineer_houses = true

	#Engineer's Workshops: small ruins with derelict machines, in four looks by biome.
	[worldgen.engineers_workshop]
		#Whether they are made at all.
		enabled = true
		#At most one in each square of this many chunks a side.
		# Default: 40
		# Range: 2 ~ 4096
		spacing = 40
		#Chunks between two at least; less than the spacing.
		# Default: 15
		# Range: 1 ~ 4095
		separation = 15

	#Colossus Foundries: the engineers' dungeon, a gatehouse over corridors, rooms with running mechanisms, spawners and a casting hall. Up to 128 blocks from its gatehouse each way.
	[worldgen.colossus_foundry]
		#Whether they are made at all.
		enabled = true
		#At most one in each square of this many chunks a side.
		# Default: 72
		# Range: 2 ~ 4096
		spacing = 72
		#Chunks between two at least; less than the spacing.
		# Default: 24
		# Range: 1 ~ 4095
		separation = 24
